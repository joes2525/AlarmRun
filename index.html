<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlarmRun – Office</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0}
  #app{display:flex;min-height:100vh}
  aside{width:190px;flex:none;background:#1f2933;color:#fff;padding:12px;display:flex;flex-direction:column;gap:4px}
  aside button{background:none;border:0;color:#cfd8e3;text-align:left;padding:8px 10px;border-radius:6px;font-size:15px;cursor:pointer}
  aside button:hover,aside button.on{background:#323f4b;color:#fff}
  aside .who{font-size:12px;color:#9aa5b1;margin:6px 0 12px;word-break:break-word}
  main{flex:1;padding:16px;min-width:0}
  #login,#setup,body>h1,#msg{margin:16px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
  .board>div{background:#f4f4f4;padding:8px;border-radius:6px}
  .board ol{padding-left:20px;margin:6px 0;font-size:13px}
  table{border-collapse:collapse;width:100%;margin-top:10px}
  td,th{border:1px solid #ccc;padding:4px 6px;text-align:left;font-size:14px;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover{background:#eef}
  form{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;padding:10px;background:#f4f4f4}
  input,select{padding:5px}
  .hidden{display:none}
  #msg{color:#b00}
  .bad{color:#b00;font-weight:bold} .good{color:#070}
  .bar{display:flex;gap:8px;align-items:center;margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<h1>AlarmRun – Office</h1>
<p id="msg"></p>

<section id="login" class="hidden">
  <form id="loginForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button name="act" value="in">Sign in</button>
    <button name="act" value="up">Sign up</button>
  </form>
</section>

<section id="setup" class="hidden">
  <h2>Set up your company</h2>
  <form id="setupForm">
    <input name="company" placeholder="Company name" required>
    <input name="name" placeholder="Your name" required>
    <button>Create company</button>
  </form>
</section>

<section id="app" class="hidden">
  <aside>
    <b>AlarmRun</b><div class="who" id="who"></div>
    <button data-tab="due">Due</button>
    <button data-tab="book">Book</button>
    <button data-tab="clients">Clients</button>
    <button data-tab="properties">Properties</button>
    <button data-tab="tenants">Tenants</button>
    <button data-tab="jobs">Jobs</button>
    <button data-tab="certificates">Certificates</button>
    <button data-tab="invoices">Invoices</button>
    <button data-tab="inspectors">Inspectors</button>
    <button id="logout" style="margin-top:auto">Log out</button>
  </aside>
  <main>

  <div id="tab-clients" class="tab">
    <h2>Clients</h2>
    <form data-table="clients">
      <input name="name" placeholder="Agency / landlord name" required>
      <select name="type"><option>agency</option><option>landlord</option><option>owner_occupier</option><option>other</option></select>
      <input name="billing_email" type="email" placeholder="Billing email">
      <input name="phone" placeholder="Phone">
      <input name="default_price" type="number" step="0.01" placeholder="Price ex GST">
      <button>Add client</button>
    </form>
  </div>

  <div id="tab-properties" class="tab hidden">
    <h2>Properties</h2>
    <form data-table="properties">
      <input name="address_line" placeholder="Street address" required>
      <input name="suburb" placeholder="Suburb">
      <input name="postcode" placeholder="Postcode">
      <select name="client_id" class="clientPick"></select>
      <input name="tenant_name" placeholder="Tenant name">
      <input name="tenant_phone" placeholder="Tenant phone">
      <input name="next_due" type="date" title="Next check due">
      <button>Add property</button>
    </form>
  </div>

  <div id="tab-tenants" class="tab hidden">
    <h2>Tenants</h2>
    <form data-table="tenancies">
      <input class="propSearch" list="propList" placeholder="Type address…" required>
      <input type="hidden" name="property_id">
      <input name="tenant_names" placeholder="Tenant name(s)" required>
      <input name="mobile" placeholder="Mobile">
      <input name="email" type="email" placeholder="Email">
      <label>Lease start <input name="lease_start" type="date"></label>
      <label>Lease end <input name="lease_end" type="date"></label>
      <label>Vacate <input name="vacate_date" type="date"></label>
      <button>Add tenancy</button>
    </form>
  </div>

  <div id="tab-jobs" class="tab hidden">
    <h2>Jobs</h2>
    <form data-table="jobs">
      <input class="propSearch" list="propList" placeholder="Type address…" required>
      <input type="hidden" name="property_id">
      <datalist id="propList"></datalist>
      <select name="job_type"><option>annual</option><option>pre_tenancy</option><option>sale</option><option>install</option><option>callout</option></select>
      <input name="scheduled_start" type="datetime-local">
      <select name="status"><option>to_book</option><option>booked</option></select>
      <button>Add job</button>
    </form>
  </div>

  <div id="tab-certificates" class="tab hidden"><h2>Certificates</h2></div>
  <div id="tab-invoices" class="tab hidden"><h2>Invoices</h2></div>
  <div id="tab-inspectors" class="tab hidden">
    <h2>Inspectors</h2>
    <form data-table="inspectors">
      <input name="name" placeholder="Name" required>
      <input name="phone" placeholder="Phone">
      <input name="base_suburb" placeholder="Home suburb">
      <input name="daily_capacity" type="number" placeholder="Jobs per day" value="18">
      <button>Add inspector</button>
    </form>
  </div>

  <div id="tab-due" class="tab hidden">
    <h2>Due</h2>
    <p style="margin:0;color:#555">Tick what you want to schedule (or a whole reason, agent or area heading), then go to <b>Book</b>.</p>
    <form id="dueFilter">
      <label>Due by <input type="date" name="by"></label>
      <input name="area" placeholder="Area, suburb or postcode">
      <select name="group"><option value="agency,area">Group: agent → area</option><option value="area,agency">Group: area → agent</option></select>
      <button>Show</button>
      <span id="dueInfo"></span> · <b id="selCount">0 selected</b>
    </form>
    <style>#dueList{width:100%}#dueList tr:not([class]) td:not(:last-child){white-space:nowrap;width:1%}#dueList th:last-child{width:auto}.g0 td{background:#1f2933;color:#fff;font-weight:bold}.g1 td{background:#dde3ea;font-weight:bold}.g2 td{background:#eef1f4;font-weight:600}</style>
    <table id="dueList"></table>
  </div>

  <div id="tab-book" class="tab hidden">
    <h2>Book</h2>
    <form id="bookForm">
      <select name="inspector" class="inspPick" required></select>
      <input type="date" name="day" required>
      <button>Book selected</button>
      <button type="button" id="clearSel">Clear selection</button>
      <span id="bookInfo"></span>
    </form>
    <details><summary id="selSummary">0 selected</summary><ol id="selList" style="font-size:13px"></ol></details>
    <h3>Day board</h3>
    <div class="bar"><label>Day <input type="date" id="boardDay"></label></div>
    <div class="board" id="board"></div>
  </div>

  <!-- shared list area -->
  <div id="listArea">
    <div class="bar">
      <input id="search" placeholder="Search…" size="30">
      <button id="prev">◀ Prev</button><span id="pageInfo"></span><button id="next">Next ▶</button>
    </div>
    <table id="list"></table>
  </div>

  <!-- property detail -->
  <div id="detail" class="hidden">
    <p><button id="back">← Back to list</button></p>
    <div id="detailBody"></div>
  </div>
  </main>
</section>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
const PAGE = 50;
let companyId = null, tab = 'clients', page = 0, term = '';
const $ = s => document.querySelector(s);
const show = id => ['login','setup','app'].forEach(s => $('#'+s).classList.toggle('hidden', s !== id));
const msg = t => $('#msg').textContent = t || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = (r, p) => p.split('.').reduce((o, k) => o && o[k], r);
const date = v => v ? String(v).slice(0,10) : '';
const leaseEnd = v => { if (!v) return ''; const days = Math.round((new Date(v) - new Date()) / 864e5);
  return esc(date(v)) + (days < 0 ? ' <span class=bad>(ended)</span>' : days <= 60 ? ` <span class=bad>(${days} days)</span>` : ''); };
const money = v => v == null ? '' : '$' + Number(v).toFixed(2);

// What each tab lists, what it searches, how it sorts
const views = {
  clients: { table:'clients', select:'id,name,type,billing_email,phone', search:'name', order:'name', asc:true,
    cols:[['Name','name'],['Type','type'],['Billing email','billing_email'],['Phone','phone']] },
  properties: { table:'properties', select:'id,address_line,suburb,postcode,next_due,tenant_name,clients(name)', search:'address_line', order:'address_line', asc:true, click:true,
    cols:[['Address','address_line'],['Suburb','suburb'],['Agency','clients.name'],['Tenant','tenant_name'],['Next due','next_due',date]] },
  tenants: { table:'tenancies', select:'id,tenant_names,mobile,email,lease_start,lease_end,vacate_date,property_id,properties!inner(address_line,suburb)', search:'tenant_names', order:'lease_end', asc:false, click:'property_id',
    cols:[['Address','properties.address_line'],['Suburb','properties.suburb'],['Tenants','tenant_names'],['Mobile','mobile'],['Email','email'],['Lease start','lease_start',date],['Lease end','lease_end',leaseEnd,'html'],['Vacate','vacate_date',date]] },
  inspectors: { table:'inspectors', select:'name,phone,base_suburb,daily_capacity,active', search:'name', order:'name', asc:true,
    cols:[['Name','name'],['Phone','phone'],['Home suburb','base_suburb'],['Jobs/day','daily_capacity'],['Active','active']] },
  jobs: { table:'jobs', select:'id,job_type,status,scheduled_start,notes,locked,inspectors(name),properties!inner(address_line,suburb)', search:'properties.address_line', order:'scheduled_start', asc:false,
    cols:[['Date','scheduled_start',date],['Address','properties.address_line'],['Suburb','properties.suburb'],['Type','job_type'],['Inspector','inspectors.name'],['Status','status',null,'status'],['Notes','notes']] },
  certificates: { table:'certificates', select:'number,compliant,issued_at,jobs!inner(properties!inner(address_line,suburb))', search:'number', order:'issued_at', asc:false,
    cols:[['Number','number'],['Issued','issued_at',date],['Address','jobs.properties.address_line'],['Suburb','jobs.properties.suburb'],['Result','compliant',v => v ? '<span class=good>Compliant</span>' : '<span class=bad>Not compliant</span>', 'html']] },
  invoices: { table:'invoices', select:'number,amount_ex_gst,gst,status,due_date,clients(name)', search:'number', order:'due_date', asc:false,
    cols:[['Number','number'],['Client','clients.name'],['Ex GST','amount_ex_gst',money],['GST','gst',money],['Status','status'],['Due','due_date',date]] },
};

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('login');
  $('#who').textContent = session.user.email;
  const { data, error } = await sb.from('memberships').select('company_id,companies(name)').limit(1);
  if (error) { msg(error.message); return show('setup'); }
  if (!data.length) return show('setup');
  companyId = data[0].company_id;
  $('#who').textContent = `${data[0].companies?.name || ''} · ${session.user.email}`;
  document.title = `${data[0].companies?.name || 'AlarmRun'} – Office`;
  show('app');
  loadClientPick();
  document.querySelector('aside button[data-tab="due"]').click();
}

async function loadList() {
  const v = views[tab];
  let q = sb.from(v.table).select(v.select, { count: 'exact' })
    .order(v.order, { ascending: v.asc, nullsFirst: false })
    .range(page * PAGE, page * PAGE + PAGE - 1);
  if (term) q = q.ilike(v.search, `%${term}%`);
  const { data, count, error } = await q;
  if (error) return msg(error.message);
  msg('');
  const pages = Math.max(1, Math.ceil((count || 0) / PAGE));
  $('#pageInfo').textContent = ` Page ${page + 1} of ${pages} (${count} records) `;
  $('#prev').disabled = page === 0; $('#next').disabled = page + 1 >= pages;
  $('#list').innerHTML = '<tr>' + v.cols.map(c => `<th>${c[0]}</th>`).join('') + '</tr>' +
    data.map(r => `<tr${v.click ? ` class="click" data-id="${v.click === true ? r.id : r[v.click]}"` : ''}>` + v.cols.map(([, path, fmt, kind]) => {
      const val = get(r, path);
      if (kind === 'status' && !r.locked)
        return `<td><select data-job="${r.id}">${['to_book','booked','in_progress','completed','cancelled','no_access'].map(s => `<option${s===val?' selected':''}>${s}</option>`).join('')}</select></td>`;
      const out = fmt ? fmt(val) : val;
      return `<td>${kind === 'html' ? out : esc(out)}</td>`;
    }).join('') + '</tr>').join('');
}

// Property detail: info + alarms + history
async function openProperty(id) {
  $('#listArea').classList.add('hidden'); $('#detail').classList.remove('hidden');
  document.querySelectorAll('.tab form').forEach(f => f.classList.add('hidden'));
  const [{ data: p }, { data: alarms }, { data: jobs }, { data: ten }] = await Promise.all([
    sb.from('properties').select('*,clients(name)').eq('id', id).single(),
    sb.from('alarms').select('*').eq('property_id', id).order('location'),
    sb.from('jobs').select('job_type,status,scheduled_start,notes,certificates(number,compliant)').eq('property_id', id).order('scheduled_start', { ascending: false }),
    sb.from('tenancies').select('*').eq('property_id', id).order('lease_start', { ascending: false, nullsFirst: false }),
  ]);
  const today = new Date().toISOString().slice(0,10);
  $('#detailBody').innerHTML = `
    <h2>${esc(p.address_line)}, ${esc(p.suburb)} ${esc(p.postcode)}</h2>
    <p><b>Agency:</b> ${esc(p.clients?.name)} &nbsp; <b>Next due:</b> ${date(p.next_due)}<br>
    <b>Tenant:</b> ${esc(p.tenant_name)} ${esc(p.tenant_phone)} ${esc(p.tenant_email)}<br>
    <b>Lease:</b> ${date(p.lease_start)} → ${date(p.lease_end)}<br>
    <b>Notes:</b> ${esc(p.access_notes)}</p>
    <form id="breakdownForm"><input name="notes" placeholder="Breakdown details e.g. hallway alarm beeping" size="45" required><button>Log breakdown</button></form>
    <h3>Tenancies (${ten.length})</h3>
    <table><tr><th>Tenants</th><th>Mobile</th><th>Email</th><th>Move in</th><th>Lease</th><th>Vacate</th><th>PM</th></tr>
    ${ten.map(t => `<tr><td>${esc(t.tenant_names)}</td><td>${esc(t.mobile)}</td><td>${esc(t.email)}</td><td>${date(t.move_in)}</td>
      <td>${date(t.lease_start)} → ${leaseEnd(t.lease_end)}</td><td>${date(t.vacate_date)}</td><td>${esc(t.property_manager)}</td></tr>`).join('')}</table>
    <h3>Alarms (${alarms.length})</h3>
    <table><tr><th>Location</th><th>Type</th><th>Power</th><th>Brand</th><th>Expires</th></tr>
    ${alarms.map(a => `<tr><td>${esc(a.location)}</td><td>${esc(a.sensor_type)}</td><td>${esc(a.power_source)}</td><td>${esc(a.brand)}</td>
      <td class="${a.expiry_date && a.expiry_date < today ? 'bad' : ''}">${date(a.expiry_date)}</td></tr>`).join('')}</table>
    <form id="alarmForm">
      <input name="location" placeholder="Location e.g. Bedroom 1" required>
      <select name="sensor_type"><option>photoelectric</option><option>ionisation</option><option>heat</option><option>other</option></select>
      <select name="power_source"><option>hardwired</option><option>10yr_lithium</option><option>9v</option><option>other</option></select>
      <input name="brand" placeholder="Brand">
      <input name="manufacture_date" type="date" title="Manufacture date">
      <button>Add alarm</button>
    </form>
    <h3>Inspection history (${jobs.length})</h3>
    <table><tr><th>Date</th><th>Type</th><th>Status</th><th>Certificate</th><th>Notes</th></tr>
    ${jobs.map(j => { const c = j.certificates?.[0] || j.certificates; return `<tr><td>${date(j.scheduled_start)}</td><td>${esc(j.job_type)}</td><td>${esc(j.status)}</td>
      <td>${c?.number ? esc(c.number) + (c.compliant ? ' <span class=good>✓</span>' : ' <span class=bad>✗</span>') : ''}</td><td>${esc(j.notes)}</td></tr>`; }).join('')}</table>`;
  $('#breakdownForm').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('jobs').insert({ company_id: companyId, property_id: id, job_type: 'callout', status: 'to_book', notes: e.target.notes.value });
    if (error) return msg(error.message);
    msg('Breakdown logged – it is now in Schedule'); openProperty(id);
  };
  $('#alarmForm').onsubmit = async e => {
    e.preventDefault();
    const row = { company_id: companyId, property_id: id };
    for (const [k, v] of new FormData(e.target)) if (v !== '') row[k] = v;
    const { error } = await sb.from('alarms').insert(row);
    if (error) return msg(error.message);
    openProperty(id);
  };
}

async function loadClientPick() {
  const { data } = await sb.from('clients').select('id,name').order('name');
  document.querySelectorAll('.clientPick').forEach(s =>
    s.innerHTML = '<option value="">— client —</option>' + (data||[]).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join(''));
}

// Address search for the job form
let propMatches = {};
document.querySelectorAll('.propSearch').forEach(inp => inp.addEventListener('input', async e => {
  const t = e.target.value, hidden = e.target.form.property_id;
  hidden.value = propMatches[t] || '';
  if (t.length < 3 || propMatches[t]) return;
  const { data } = await sb.from('properties').select('id,address_line,suburb').ilike('address_line', `%${t}%`).limit(20);
  propMatches = {};
  $('#propList').innerHTML = (data||[]).map(p => { const label = `${p.address_line}, ${p.suburb}`; propMatches[label] = p.id; return `<option value="${esc(label)}">`; }).join('');
}));

// ---------- Scheduling ----------
const iso = d => d.toISOString().slice(0,10);
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
let inspectors = [];
const selected = new Map();   // key → {prop, job, label}
const selKey = c => c.dataset.job || 'p:' + c.dataset.prop;

async function openSchedule() {
  const f = $('#dueFilter');
  if (!f.by.value) f.by.value = addDays(14);
  if (!$('#bookForm').day.value) $('#bookForm').day.value = addDays(1);
  if (!$('#boardDay').value) $('#boardDay').value = addDays(1);
  const { data } = await sb.from('inspectors').select('id,name,daily_capacity').eq('active', true).order('name');
  inspectors = data || [];
  document.querySelectorAll('.inspPick').forEach(s => s.innerHTML = '<option value="">— inspector —</option>' +
    inspectors.map(i => `<option value="${i.id}">${esc(i.name)} (${i.daily_capacity}/day)</option>`).join(''));
  if (tab === 'due') loadDue(); else { showSel(); loadBoard(); }
}

async function loadDue() {
  const f = $('#dueFilter');
  let q = sb.from('schedule_queue').select('reason,property_id,job_id,address_line,suburb,postcode,agency,area,last_done,due_date,notes', { count: 'exact' })
    .lte('due_date', f.by.value).order('due_date').limit(3000);
  const a = f.area.value.trim();
  if (a) q = /^\d+$/.test(a) ? q.eq('postcode', a) : q.or(`area.ilike.%${a}%,suburb.ilike.%${a}%`);
  const { data, count, error } = await q;
  if (error) return msg(error.message);
  const today = iso(new Date()), [k1, k2] = f.group.value.split(',');
  const tree = {};   // reason → group → subgroup → rows
  for (const r of data) (((tree[r.reason] ??= {})[r[k1] || '—'] ??= {})[r[k2] || '—'] ??= []).push(r);
  const n = o => Array.isArray(o) ? o.length : Object.values(o).reduce((t, v) => t + n(v), 0);
  const bySize = o => Object.keys(o).sort((x, y) => n(o[y]) - n(o[x]));
  let html = '<tr><th></th><th>Address</th><th>Last done</th><th>Due</th><th>Notes</th></tr>', gi = 0;
  const head = (cls, id, label, pad) => `<tr class="${cls}"><td><input type="checkbox" data-group="${id}"></td><td colspan="4">${pad}${label}</td></tr>`;
  for (const reason of ['Breakdown', 'Annual'].filter(x => tree[x])) {
    const id0 = 'r' + (gi++);
    html += head('g0', id0, `${reason} — ${n(tree[reason])}`, '');
    for (const g1 of bySize(tree[reason])) {
      const id1 = 'g' + (gi++);
      html += head('g1', id1, `${esc(g1)} — ${n(tree[reason][g1])}`, '&nbsp;&nbsp;');
      for (const g2 of bySize(tree[reason][g1])) {
        const id2 = 'g' + (gi++), rows = tree[reason][g1][g2]
          .sort((x, y) => (x.suburb || '').localeCompare(y.suburb || '') || x.address_line.localeCompare(y.address_line));
        html += head('g2', id2, `${esc(g2)} — ${rows.length}`, '&nbsp;&nbsp;&nbsp;&nbsp;');
        html += rows.map(r => `<tr><td><input type="checkbox" class="pick ${id0} ${id1} ${id2}" data-prop="${r.property_id}" data-job="${r.job_id || ''}" data-label="${esc(r.reason + ': ' + r.address_line + ', ' + r.suburb)}"${selected.has(r.job_id || 'p:' + r.property_id) ? ' checked' : ''}></td>
          <td>${esc(r.address_line)}, ${esc(r.suburb)}</td><td>${date(r.last_done)}</td>
          <td class="${r.due_date < today ? 'bad' : ''}">${date(r.due_date)}</td><td>${esc(r.notes)}</td></tr>`).join('');
      }
    }
  }
  $('#dueInfo').textContent = `${count} waiting` + (count > 3000 ? ' (showing 3000)' : '');
  $('#dueList').innerHTML = html;
  $('#dueList').onchange = e => {
    const g = e.target.dataset.group;
    const boxes = g ? [...document.querySelectorAll('.pick.' + g)] : e.target.classList.contains('pick') ? [e.target] : [];
    boxes.forEach(c => { c.checked = e.target.checked; c.checked ? selected.set(selKey(c), { prop: c.dataset.prop, job: c.dataset.job, label: c.dataset.label }) : selected.delete(selKey(c)); });
    showSel();
  };
  showSel();
}

async function dayCount(inspectorId, day) {
  const { count } = await sb.from('jobs').select('id', { count: 'exact', head: true })
    .eq('inspector_id', inspectorId).gte('scheduled_start', day + 'T00:00').lte('scheduled_start', day + 'T23:59')
    .neq('status', 'cancelled');
  return count || 0;
}

function showSel() {
  $('#selCount').textContent = $('#selSummary').textContent = `${selected.size} selected`;
  $('#selList').innerHTML = [...selected.values()].map(v => `<li>${esc(v.label)}</li>`).join('');
  updateBookInfo();
}
$('#clearSel').onclick = () => { selected.clear(); showSel(); };

async function updateBookInfo() {
  const f = $('#bookForm'), n = selected.size;
  const ins = inspectors.find(i => i.id === f.inspector.value);
  if (!ins || !f.day.value) return $('#bookInfo').textContent = `${n} selected`;
  const have = await dayCount(ins.id, f.day.value), total = have + n;
  $('#bookInfo').innerHTML = `${n} selected · ${esc(ins.name)} on ${f.day.value}: ${total}/${ins.daily_capacity}` +
    (total > ins.daily_capacity ? ' <span class=bad>over capacity</span>' : '');
}
$('#bookForm').inspector.onchange = updateBookInfo;
$('#bookForm').day.onchange = updateBookInfo;

$('#dueFilter').onsubmit = e => { e.preventDefault(); loadDue(); };
$('#dueFilter').group.onchange = loadDue;
$('#bookForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, picks = [...selected.values()];
  if (!picks.length) return msg('Nothing selected – tick properties on the Due page first');
  const when = `${f.day.value}T09:00:00`, start = await dayCount(f.inspector.value, f.day.value);
  const fresh = picks.filter(c => !c.job).map((c, i) => ({ company_id: companyId, property_id: c.prop, job_type: 'annual',
    status: 'booked', inspector_id: f.inspector.value, scheduled_start: when, route_order: start + i + 1 }));
  if (fresh.length) { const { error } = await sb.from('jobs').insert(fresh); if (error) return msg(error.message); }
  const existing = picks.filter(c => c.job);
  for (const [i, c] of existing.entries()) {
    const { error } = await sb.from('jobs').update({ status: 'booked', inspector_id: f.inspector.value, scheduled_start: when,
      route_order: start + fresh.length + i + 1 }).eq('id', c.job);
    if (error) return msg(error.message);
  }
  msg(`Booked ${picks.length}`); selected.clear(); showSel(); $('#boardDay').value = f.day.value; loadBoard();
};

async function loadBoard() {
  const day = $('#boardDay').value;
  const { data, error } = await sb.from('jobs').select('id,status,inspector_id,route_order,properties(address_line,suburb)')
    .gte('scheduled_start', day + 'T00:00').lte('scheduled_start', day + 'T23:59').neq('status', 'cancelled')
    .order('route_order');
  if (error) return msg(error.message);
  const cols = [...inspectors, { id: null, name: 'Unassigned', daily_capacity: '' }];
  $('#board').innerHTML = cols.map(i => {
    const js = data.filter(j => j.inspector_id === i.id);
    if (!i.id && !js.length) return '';
    const over = i.daily_capacity && js.length > i.daily_capacity;
    return `<div><b>${esc(i.name)}</b> <span class="${over ? 'bad' : ''}">${js.length}${i.daily_capacity ? '/' + i.daily_capacity : ''}</span>
      <ol>${js.map(j => `<li>${esc(j.properties?.address_line)}, ${esc(j.properties?.suburb)} <small>(${j.status})</small>
        <button data-unbook="${j.id}" title="Cancel">✕</button></li>`).join('')}</ol></div>`;
  }).join('');
}
$('#boardDay').onchange = loadBoard;
$('#board').onclick = async e => {
  const id = e.target.dataset.unbook; if (!id) return;
  const { error } = await sb.from('jobs').update({ status: 'cancelled' }).eq('id', id);
  if (error) return msg(error.message);
  loadBoard(); loadDue();
};

// Events
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target), act = e.submitter.value;
  const creds = { email: f.get('email'), password: f.get('password') };
  const { error } = act === 'up'
    ? await sb.auth.signUp({ ...creds, options: { emailRedirectTo: location.origin + location.pathname } })
    : await sb.auth.signInWithPassword(creds);
  if (error) return msg(error.message);
  msg(act === 'up' ? 'Check your email to confirm, then sign in.' : '');
  start();
});

$('#setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await sb.rpc('create_company', { company_name: f.get('company'), your_name: f.get('name') });
  if (error) return msg(error.message);
  start();
});

document.querySelectorAll('form[data-table]').forEach(form => form.addEventListener('submit', async e => {
  e.preventDefault();
  const row = { company_id: companyId };
  for (const [k, v] of new FormData(form)) if (v !== '') row[k] = v;
  if (form.querySelector('.propSearch') && !row.property_id) return msg('Pick an address from the list');
  const { error } = await sb.from(form.dataset.table).insert(row);
  if (error) return msg(error.message);
  msg(''); form.reset(); loadList(); if (form.dataset.table === 'clients') loadClientPick();
}));

$('#list').addEventListener('click', e => { const tr = e.target.closest('tr.click'); if (tr && e.target.tagName !== 'SELECT') openProperty(tr.dataset.id); });
$('#list').addEventListener('change', async e => {
  const id = e.target.dataset.job; if (!id) return;
  const { error } = await sb.from('jobs').update({ status: e.target.value }).eq('id', id);
  msg(error ? error.message : '');
});
let timer;
$('#search').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { term = e.target.value.trim(); page = 0; loadList(); }, 300); });
$('#prev').onclick = () => { page--; loadList(); };
$('#next').onclick = () => { page++; loadList(); };
$('#back').onclick = () => { $('#detail').classList.add('hidden'); $('#listArea').classList.remove('hidden'); document.querySelectorAll('.tab form').forEach(f => f.classList.remove('hidden')); loadList(); };
document.querySelectorAll('aside button[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; page = 0; term = ''; $('#search').value = '';
  document.querySelectorAll('aside button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('hidden', t.id !== 'tab-' + tab));
  $('#detail').classList.add('hidden');
  if (tab === 'due' || tab === 'book') { $('#listArea').classList.add('hidden'); return openSchedule(); }
  $('#back').onclick();
});
$('#logout').onclick = async () => { await sb.auth.signOut(); show('login'); };

start();
</script>
</body>
</html>
