<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Smoke alarm visit – your details</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
  :root { --navy:#102a43; --orange:#ff6b35; --blue:#2f6fed; --bg:#f3f6fa; --line:#e3e8f0; --muted:#52677b; --ok:#16845b; --bad:#c8312b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; color: var(--navy); background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: 18px 20px; border-bottom: 4px solid var(--orange); }
  header b { font-size: 18px; } header div { color: #aab6cc; font-size: 14px; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; } h2 { font-size: 17px; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 6px 0 10px; } li { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  input, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #cdd5e1; border-radius: 10px; background: #fff; }
  textarea { min-height: 90px; }
  .row { display: flex; gap: 8px; } .row input { flex: 1; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--blue); color: #fff; cursor: pointer; }
  button.g { background: #e9edf4; color: var(--navy); } button.x { background: none; color: var(--bad); padding: 4px 8px; font-size: 14px; }
  button:disabled { opacity: .6; }
  .tag { font-size: 12px; color: var(--muted); }
  #msg { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; display: none; max-width: 90%; }
  label { display: block; font-weight: 700; margin: 10px 0 4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2611271500"></script>
</head>
<body>
<header><b id="co">Smoke alarm visit</b><div id="coPhone"></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="msg"></div>
<script src="js/tenant.js?v=2611271500"></script>
</body>
</html>
