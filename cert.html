<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke alarm compliance certificate</title>
<style>
  @page { size: A4; margin: 14mm; }
  body { font-family: system-ui, Arial, sans-serif; color: #1f2933; margin: 0; background: #e9ecef; font-size: 11pt; }
  .page { background: #fff; width: 210mm; min-height: 297mm; margin: 16px auto; padding: 14mm; box-sizing: border-box; box-shadow: 0 2px 8px #0003; }
  .bar { text-align: center; margin: 12px; }
  .bar button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; background: #1f6feb; color: #fff; cursor: pointer; }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1f2933; padding-bottom: 10px; }
  header h1 { margin: 0; font-size: 20pt; }
  .co { text-align: right; font-size: 10pt; line-height: 1.4; }
  .result { margin: 14px 0; padding: 12px 14px; border-radius: 6px; font-size: 14pt; font-weight: 700; color: #fff; }
  .result.ok { background: #1e8e3e; } .result.no { background: #c0392b; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin: 10px 0; }
  .grid div span { display: block; font-size: 9pt; color: #616e7c; text-transform: uppercase; letter-spacing: .03em; }
  h2 { font-size: 12pt; margin: 18px 0 6px; border-bottom: 1px solid #cbd2d9; padding-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #e4e7eb; vertical-align: top; }
  th { background: #f1f3f5; }
  .bad { color: #b00; font-weight: 600; }
  .stmt { margin-top: 16px; font-size: 10pt; line-height: 1.5; }
  footer { margin-top: 24px; font-size: 9pt; color: #616e7c; border-top: 1px solid #cbd2d9; padding-top: 8px; }
  #msg { text-align: center; color: #b00; }
  .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pics figure { margin: 0; break-inside: avoid; }
  .pics img { width: 100%; height: 48mm; object-fit: cover; border-radius: 4px; border: 1px solid #cbd2d9; }
  .pics figcaption { font-size: 9pt; color: #616e7c; margin-top: 2px; }
  .prop { display: grid; grid-template-columns: 1fr 62mm; gap: 18px; align-items: start; }
  .prop img { width: 62mm; height: 44mm; object-fit: cover; border-radius: 6px; border: 1px solid #cbd2d9; margin-top: 10px; }
  .pics.big { grid-template-columns: repeat(2, 1fr); } .pics.big img { height: 62mm; }
  @media print { body { background: #fff; } .page { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; } .bar { display: none; }
    #cert2 { break-before: page; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2611271139"></script>
</head>
<body>
<div class="bar"><button onclick="print()">Print / save as PDF</button> <span id="previewNote"></span></div>
<p id="msg"></p>
<div class="page" id="cert"></div>
<div class="page" id="cert2" hidden></div>
<script src="js/cert.js?v=2611271139"></script>
</body>
</html>
