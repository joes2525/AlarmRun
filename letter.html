<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entry notice letters</title>
<style>
  @page { size: A4; margin: 18mm; }
  body { font-family: system-ui, Arial, sans-serif; color: #1f2933; margin: 0; background: #e9ecef; font-size: 11pt; }
  .bar { text-align: center; margin: 12px; }
  .bar button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; background: #1f6feb; color: #fff; cursor: pointer; }
  .letter { background: #fff; width: 210mm; min-height: 297mm; margin: 16px auto; padding: 18mm; box-sizing: border-box; box-shadow: 0 2px 8px #0003; page-break-after: always; }
  .from { text-align: right; font-size: 10pt; line-height: 1.4; }
  .to { margin-top: 18mm; min-height: 30mm; line-height: 1.45; }      /* sits in a standard DL window envelope */
  .date { margin: 10mm 0 6mm; }
  .subject { font-weight: 700; margin-bottom: 6mm; }
  .body { white-space: pre-wrap; line-height: 1.5; }
  #msg { text-align: center; color: #b00; }
  @media print { body { background: #fff; } .letter { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; } .bar { display: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2611271608"></script>
</head>
<body>
<div class="bar"><button onclick="print()">Print letters</button> <span id="count"></span></div>
<p id="msg"></p>
<div id="letters"></div>
<script src="js/letter.js?v=2611271608"></script>
</body>
</html>
