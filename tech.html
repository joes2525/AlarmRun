<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AlarmRun – Inspector</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/tech.css?v=2611271521">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2611271521"></script>
</head>
<body>
<header>
  <b>AlarmRun</b>
  <select id="asInspector" hidden></select>
  <button id="logout" class="link">Log out</button>
</header>
<p id="msg"></p>

<section id="login" hidden>
  <form id="loginForm" class="card">
    <h2>Inspector login</h2>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="primary">Sign in</button>
  </form>
</section>

<section id="home" hidden>
  <h2 id="hello" style="margin:6px 2px 2px"></h2>
  <p class="muted" id="today" style="margin:0 2px 10px"></p>
  <div id="homeBody"></div>
</section>

<section id="run" hidden>
  <button class="link" id="toHome">← Home</button>
  <div class="daybar"><button id="prevDay">◀</button><h2 id="dayLabel"></h2><button id="nextDay">▶</button></div>
  <div class="row" style="margin:0 0 10px"><button id="reorder">↕ Reorder</button></div>
  <div id="jobs"></div>
</section>

<section id="job" hidden>
  <button id="back" class="link">← Today's run</button>
  <div id="jobBody"></div>
</section>

<script src="js/tech.js?v=2611271521"></script>
</body>
</html>
